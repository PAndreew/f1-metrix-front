name: Frontend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          npm run preview -- --port 5178 > /tmp/f1metrix-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5178 >/dev/null && break || sleep 1; done
          npm run test:browser
